<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Class 12 PCM — NCERT Chapter Tracker</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap');

    :root {
      --bg: #050812;
      --panel: rgba(12, 20, 38, .82);
      --panel-2: #101b31;
      --card: rgba(15, 27, 48, .92);
      --card-hover: rgba(22, 40, 68, .98);
      --text: #eff7ff;
      --muted: #91a8c8;
      --blue: #38d9ff;
      --green: #58ffc3;
      --purple: #b68cff;
      --orange: #ffc46b;
      --border: rgba(92, 213, 255, .19);
      --shadow: 0 18px 48px rgba(0,0,0,.42), 0 0 28px rgba(56,217,255,.045);
      --radius: 18px;
    }

    * { box-sizing: border-box; scroll-behavior: smooth; }

    body {
      margin: 0;
      padding: 32px;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(ellipse at 8% 0%, rgba(56,217,255,.16), transparent 32%),
        radial-gradient(ellipse at 92% 8%, rgba(182,140,255,.14), transparent 30%),
        linear-gradient(rgba(56,217,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(56,217,255,.025) 1px, transparent 1px),
        var(--bg);
      background-size: auto, auto, 36px 36px, 36px 36px, auto;
      font-family: 'Outfit', sans-serif;
      line-height: 1.5;
    }

    .wrap { max-width: 1450px; margin: auto; }

    header { text-align: center; margin: 8px 0 28px; }
    h1 {
      margin: 0;
      font-size: clamp(2rem, 4vw, 3.4rem);
      font-weight: 800;
      letter-spacing: -.04em;
      background: linear-gradient(90deg, var(--blue), var(--purple), var(--green));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle { color: var(--muted); margin-top: 8px; font-size: 1rem; }

    .overall {
      background: linear-gradient(145deg, rgba(21,30,43,.98), rgba(13,19,28,.98));
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 22px;
      box-shadow: var(--shadow);
      margin-bottom: 28px;
    }

    .overall-top, .subject-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .overall-title { font-size: 1.1rem; font-weight: 700; }
    .overall-count, .subject-count { color: var(--muted); font-size: .88rem; }

    .bar {
      height: 14px;
      background: #273242;
      border-radius: 99px;
      overflow: hidden;
      margin-top: 14px;
      box-shadow: inset 0 1px 3px rgba(0,0,0,.35);
    }
    .fill {
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--blue), var(--purple), var(--green));
      transition: width .45s ease;
    }

    #subjects {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      align-items: start;
      gap: 18px;
    }

    .subject {
      min-width: 0;
      background: linear-gradient(155deg, rgba(12,20,38,.94), rgba(8,14,27,.94));
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      margin-bottom: 0;
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
      position: relative;
      overflow: hidden;
    }
    .subject::before {
      content: "";
      position: absolute;
      top: 0; left: 12%; right: 12%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--blue), transparent);
      opacity: .75;
    }

    .subject h2 { margin: 0; font-size: 1.7rem; }
    .subject.physics h2 { color: var(--blue); }
    .subject.chemistry h2 { color: var(--green); }
    .subject.maths h2 { color: var(--purple); }

    .subject .bar { margin: 14px 0 20px; height: 10px; }

    .chapters {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 12px;
    }

    .chapter[hidden] { display: none !important; }
    .chapter {
      background: linear-gradient(145deg, var(--card), rgba(8,15,29,.96));
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 13px;
      transition: transform .2s ease, border-color .2s ease, opacity .3s ease, box-shadow .2s ease;
      animation: rise-in .35s ease both;
    }
    .chapter:hover {
      transform: translateY(-2px);
      background: var(--card-hover);
      border-color: rgba(56,217,255,.48);
      box-shadow: 0 8px 26px rgba(56,217,255,.07);
    }
    @keyframes rise-in {
      from { opacity: 0; transform: translateY(7px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .chapter.done { border-color: rgba(69,212,131,.35); }

    .chapter-head {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 10px;
    }
    .chapter-number {
      min-width: 31px;
      height: 31px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: rgba(88,166,255,.12);
      color: var(--blue);
      font-weight: 800;
      font-size: .82rem;
    }
    .chemistry .chapter-number { background: rgba(69,212,131,.11); color: var(--green); }
    .maths .chapter-number { background: rgba(167,139,250,.12); color: var(--purple); }

    .chapter-name { font-weight: 600; font-size: .98rem; line-height: 1.25; }
    .chapter-status { margin-left: auto; color: var(--muted); font-size: .76rem; white-space: nowrap; }

    .mini-bar {
      height: 5px;
      background: #273242;
      border-radius: 99px;
      overflow: hidden;
      margin: 9px 0 12px;
    }
    .mini-fill {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, var(--blue), var(--green));
      transition: width .3s ease;
    }

    .boxes {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(25px, 1fr));
      gap: 6px;
    }

    .box {
      position: relative;
      aspect-ratio: 1;
    }
    .box input {
      position: absolute;
      opacity: 0;
      inset: 0;
      cursor: pointer;
    }
    .box span {
      width: 100%;
      height: 100%;
      min-height: 25px;
      display: grid;
      place-items: center;
      border: 1px solid #3a485a;
      border-radius: 7px;
      background: #202b3a;
      color: #8d9db2;
      font-size: .65rem;
      font-weight: 700;
      transition: all .18s ease;
      user-select: none;
    }
    .box:hover span { border-color: var(--blue); transform: translateY(-1px); }
    .box input:checked + span {
      background: linear-gradient(145deg, #087f70, #19b88e);
      border-color: var(--green);
      color: white;
      box-shadow: 0 3px 10px rgba(69,212,131,.18);
    }

    .legend {
      color: var(--muted);
      font-size: .78rem;
      margin-top: 12px;
      text-align: center;
    }

    .controls {
      display: flex;
      justify-content: center;
      margin-top: 22px;
      gap: 10px;
      flex-wrap: wrap;
    }
    button {
      border: 1px solid var(--border);
      background: #182332;
      color: var(--text);
      padding: 9px 15px;
      border-radius: 10px;
      font: inherit;
      cursor: pointer;
    }
    button:hover { background: #223044; }

    .overall {
      background: linear-gradient(145deg, rgba(14,25,46,.95), rgba(8,14,27,.96));
      border-color: var(--border);
      backdrop-filter: blur(14px);
    }
    button {
      border-color: rgba(56,217,255,.28);
      background: linear-gradient(145deg, rgba(20,37,62,.95), rgba(10,19,35,.95));
      transition: border-color .2s ease, transform .2s ease, box-shadow .2s ease;
    }
    button:hover {
      background: #142943;
      border-color: var(--blue);
      box-shadow: 0 0 18px rgba(56,217,255,.12);
      transform: translateY(-1px);
    }
    .legend { font-size: .72rem; }
    @media (max-width: 1050px) {
      #subjects { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 700px) {
      body { padding: 16px; }
      #subjects { grid-template-columns: 1fr; }
      .subject { padding: 15px; }
      .chapters { grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); }
      .boxes { gap: 4px; }
      .box span { font-size: .58rem; min-height: 23px; }
    }
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Class 12 • PCM Study Tracker</h1>
  </header>

  <section class="overall">
    <div class="overall-top">
      <div class="overall-title">Overall Progress</div>
      <div id="overall-count" class="overall-count">0 / 370 checkpoints</div>
    </div>
    <div class="bar"><div id="overall-fill" class="fill"></div></div>
  </section>

  <main id="subjects"></main>

  <div class="controls">
    <button id="reset">Reset all progress</button>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  // ============================================================
  // EASY CHAPTER CHECKPOINT SETTINGS
  // Change ONLY the `boxes` number for any chapter.
  //
  // Example:
  // { name: 'Matrices', boxes: 6 }   -> 6 boxes
  // { name: 'Integrals', boxes: 15 } -> 15 boxes
  //
  // You can use a different number for EVERY chapter.
  // ============================================================
  const data = {
    Physics: [
      { name: 'Electric Charges and Fields', boxes: 10 },
      { name: 'Electrostatic Potential and Capacitance', boxes: 12 },
      { name: 'Current Electricity', boxes: 10 },
      { name: 'Moving Charges and Magnetism', boxes: 8 },
      { name: 'Magnetism and Matter', boxes: 3 },
      { name: 'Electromagnetic Induction', boxes: 5 },
      { name: 'Alternating Current', boxes: 5 },
      { name: 'Electromagnetic Waves', boxes: 2 },
      { name: 'Ray Optics and Optical Instruments', boxes: 9 },
      { name: 'Wave Optics', boxes: 3 },
      { name: 'Dual Nature of Radiation and Matter', boxes: 2 },
      { name: 'Atoms', boxes: 1 },
      { name: 'Nuclei', boxes: 2 },
      { name: 'Semiconductor Electronics: Materials, Devices and Simple Circuits', boxes: 1 }
    ],
    Chemistry: [
      { name: 'Solutions', boxes: 15 },
      { name: 'Electrochemistry', boxes: 14 },
      { name: 'Chemical Kinetics', boxes: 8 },
      { name: 'The d- and f-Block Elements', boxes: 15 },
      { name: 'Coordination Compounds', boxes: 11 },
      { name: 'Haloalkanes and Haloarenes', boxes: 12 },
      { name: 'Alcohols, Phenols and Ethers', boxes: 8 },
      { name: 'Aldehydes, Ketones and Carboxylic Acids', boxes: 9 },
      { name: 'Amines', boxes: 4 },
      { name: 'Biomolecules', boxes: 4 }
    ],
    Maths: [
      { name: 'Relations and Functions', boxes: 10 },
      { name: 'Inverse Trigonometric Functions', boxes: 6 },
      { name: 'Matrices', boxes: 8 },
      { name: 'Determinants', boxes: 7 },
      { name: 'Continuity and Differentiability', boxes: 12 },
      { name: 'Application of Derivatives', boxes: 7 },
      { name: 'Integrals', boxes: 15 },
      { name: 'Application of Integrals', boxes: 2 },
      { name: 'Differential Equations', boxes: 7 },
      { name: 'Vector Algebra', boxes: 0 },
      { name: 'Three Dimensional Geometry', boxes: 0 },
      { name: 'Linear Programming', boxes: 2 },
      { name: 'Probability', boxes: 0 }
    ]
  };

  const subjectClass = {
    Physics: 'physics',
    Chemistry: 'chemistry',
    Maths: 'maths'
  };

  const root = document.getElementById('subjects');
  const TOTAL_BOXES = Object.values(data).flat().reduce((sum, chapter) => sum + Math.max(0, Number(chapter.boxes) || 0), 0);

  function key(subject, chapterIndex, boxIndex) {
    return `class12-pcm-${subject}-${chapterIndex}-${boxIndex}`;
  }

  function createChapter(subject, chapter, chapterIndex) {
    const card = document.createElement('article');
    card.className = 'chapter';
    card.hidden = !(Number(chapter.boxes) > 0);

    const head = document.createElement('div');
    head.className = 'chapter-head';

    const num = document.createElement('div');
    num.className = 'chapter-number';
    num.textContent = String(chapterIndex + 1).padStart(2, '0');

    const name = document.createElement('div');
    name.className = 'chapter-name';
    name.textContent = chapter.name;

    const status = document.createElement('div');
    status.className = 'chapter-status';

    head.append(num, name, status);
    card.appendChild(head);

    const miniBar = document.createElement('div');
    miniBar.className = 'mini-bar';
    const miniFill = document.createElement('div');
    miniFill.className = 'mini-fill';
    miniBar.appendChild(miniFill);
    card.appendChild(miniBar);

    const boxes = document.createElement('div');
    boxes.className = 'boxes';

    // Creates exactly the number of boxes specified for THIS chapter.
    for (let i = 0; i < chapter.boxes; i++) {
      const label = document.createElement('label');
      label.className = 'box';

      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.dataset.storageKey = key(subject, chapterIndex, i);
      checkbox.checked = localStorage.getItem(checkbox.dataset.storageKey) === 'true';

      const span = document.createElement('span');
      span.textContent = i + 1;

      label.append(checkbox, span);
      boxes.appendChild(label);
    }

    card.appendChild(boxes);

    const update = () => {
      const checks = [...boxes.querySelectorAll('input')];
      const done = checks.filter(c => c.checked).length;
      const pct = chapter.boxes === 0 ? 0 : Math.round((done / chapter.boxes) * 100);
      status.textContent = `${done} / ${chapter.boxes} • ${pct}%`;
      miniFill.style.width = pct + '%';
      card.classList.toggle('done', done === chapter.boxes);
    };

    boxes.addEventListener('change', e => {
      if (e.target.type === 'checkbox') {
        localStorage.setItem(e.target.dataset.storageKey, e.target.checked);
        updateAll();
      }
    });

    update();
    return card;
  }

  function createSubject(subject, chapters) {
    const section = document.createElement('section');
    section.className = `subject ${subjectClass[subject]}`;

    const top = document.createElement('div');
    top.className = 'subject-top';

    const h2 = document.createElement('h2');
    h2.textContent = subject;

    const count = document.createElement('div');
    count.className = 'subject-count';
    count.id = `${subject}-count`;

    top.append(h2, count);
    section.appendChild(top);

    const bar = document.createElement('div');
    bar.className = 'bar';
    const fill = document.createElement('div');
    fill.className = 'fill';
    fill.id = `${subject}-fill`;
    bar.appendChild(fill);
    section.appendChild(bar);

    const grid = document.createElement('div');
    grid.className = 'chapters';

    chapters.forEach((chapter, i) => {
      grid.appendChild(createChapter(subject, chapter, i));
    });

    section.appendChild(grid);
    return section;
  }

  Object.entries(data).forEach(([subject, chapters]) => {
    root.appendChild(createSubject(subject, chapters));
  });

  function updateAll() {
    // Chapters with zero (or negative) checkpoints stay hidden; positive counts show them.
    document.querySelectorAll('.chapter').forEach(card => {
      const subject = card.closest('.subject');
      const subjectName = Object.keys(subjectClass).find(name => subject.classList.contains(subjectClass[name]));
      if (!subjectName) return;
      const chapterIndex = [...subject.querySelectorAll('.chapter')].indexOf(card);
      const chapter = data[subjectName][chapterIndex];
      card.hidden = !(Number(chapter.boxes) > 0);
    });

    let overallDone = 0;

    Object.entries(data).forEach(([subject, chapters]) => {
      let done = 0;
      const subjectTotal = chapters.reduce((sum, chapter) => sum + Math.max(0, Number(chapter.boxes) || 0), 0);

      chapters.forEach((chapter, chapterIndex) => {
        for (let boxIndex = 0; boxIndex < chapter.boxes; boxIndex++) {
          if (localStorage.getItem(key(subject, chapterIndex, boxIndex)) === 'true') {
            done++;
          }
        }
      });

      overallDone += done;
      const pct = subjectTotal === 0 ? 0 : Math.round((done / subjectTotal) * 100);
      document.getElementById(`${subject}-fill`).style.width = pct + '%';
      document.getElementById(`${subject}-count`).textContent =
        `${done} / ${subjectTotal} checkpoints • ${pct}%`;
    });

    const overallPct = Math.round((overallDone / TOTAL_BOXES) * 100);
    document.getElementById('overall-fill').style.width = overallPct + '%';
    document.getElementById('overall-count').textContent =
      `${overallDone} / ${TOTAL_BOXES} checkpoints • ${overallPct}%`;
  }

  document.getElementById('reset').addEventListener('click', () => {
    if (!confirm('Reset all Class 12 PCM progress?')) return;
    Object.keys(localStorage)
      .filter(k => k.startsWith('class12-pcm-'))
      .forEach(k => localStorage.removeItem(k));
    location.reload();
  });

  updateAll();
});
</script>
</body>
</html>
